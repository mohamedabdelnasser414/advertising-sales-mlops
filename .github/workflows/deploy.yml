name: Deploy Flask App

on:
  workflow_run:
    workflows: ["Publish Docker Image"]
    types:
      - completed

  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    runs-on: [self-hosted, docker]

    steps:
      - name: Pull Latest Docker Image
        run: |
          docker pull mohamedabdelnasser414/advertising-sales-api:latest

      - name: Stop Existing Container
        run: |
          docker stop advertising-sales-container || true
          docker rm advertising-sales-container || true

      - name: Start New Container
        run: |
          docker run -d \
            --name advertising-sales-container \
            -p 5000:5000 \
            mohamedabdelnasser414/advertising-sales-api:latest